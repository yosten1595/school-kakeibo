services:
  db:
    # LTS（長期サポート版）の最新。9.7 系の修正版は自動で取り込む
    image: mysql:9.7
    container_name: kakeibo-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kakeibo
      MYSQL_USER: kakeibo
      MYSQL_PASSWORD: kakeibo
      TZ: Asia/Tokyo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # このパソコン（127.0.0.1）からだけ接続できるようにする。認証のないアプリなので外に公開しない
      - "127.0.0.1:3306:3306"
    volumes:
      - kakeibo-db-data:/var/lib/mysql
      # 空のデータボリュームで初回起動したときだけ、ファイル名順に実行される
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u kakeibo -pkakeibo --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kakeibo-db-data:
